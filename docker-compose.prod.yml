services:
  nginx:
    image: nginx:1.25-alpine
    container_name: amrutam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - amrutam-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - amrutam-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - amrutam-network

  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amrutam-network

volumes:
  redis_data:

networks:
  amrutam-network:
    driver: bridge
