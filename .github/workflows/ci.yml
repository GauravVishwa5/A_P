name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amrutam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amrutam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "ruff==0.16.8" mypy bandit pip-audit pytest pytest-asyncio pytest-cov types-passlib types-python-jose aiosqlite

      - name: Code Formatting Check (Ruff)
        run: ruff format --check .

      - name: Static Code Analysis (Ruff Lint)
        run: ruff check .

      - name: Type Checking (Mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Security Vulnerability Scan (Bandit)
        run: bandit -r app/ -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit --ignore-vuln PYSEC-2026-1325 --ignore-vuln GHSA-wj6h-64fc-37mp
        continue-on-error: false

      - name: Run Test Suite (Pytest with Coverage)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/amrutam_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          SECRET_KEY: ci-test-secret-key-min-32-chars-xx
          JWT_SECRET_KEY: ci-test-jwt-secret-key-min-32-chars
        run: python -m pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70 tests/

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

      - name: Build Docker Image
        run: |
          docker build -t amrutam-backend:ci .

      - name: Trivy Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: amrutam-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  deploy:
    name: Deploy to AWS EC2
    needs: quality-and-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check Deployment Credentials
        id: check_creds
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning::EC2 deployment skipped: EC2_HOST or EC2_SSH_KEY secret not configured in GitHub repository settings."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check_creds.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/amrutam-backend
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
            docker image prune -f
