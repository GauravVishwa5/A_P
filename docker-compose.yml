services:
  nginx:
    image: nginx:1.25-alpine
    container_name: amrutam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - amrutam-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-api
    restart: unless-stopped
    environment:
      - APP_NAME=Amrutam Telemedicine Backend
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/amrutam_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=prod-insecure-change-in-env-secret-key-32chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - amrutam-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amrutam-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - APP_NAME=Amrutam Telemedicine Worker
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/amrutam_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amrutam-network

  postgres:
    image: postgres:16-alpine
    container_name: amrutam-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=amrutam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amrutam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amrutam-network

  redis:
    image: redis:7-alpine
    container_name: amrutam-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amrutam-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: amrutam-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - amrutam-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: amrutam-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - amrutam-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  amrutam-network:
    driver: bridge
